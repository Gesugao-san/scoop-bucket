name: Excavator 4h

# One of the three update schedules (docs/automation.md#update-tiers): every 4 hours at :20, the Frequent tier:
# manifests whose version changed less than dailyAfterDays days ago (update-tiers.json), and keepInExcavator.
# Excavator 1d (excavator-1d.yml) and 1mo (excavator-1mo.yml) cover the rest of the manifests; the two Excavators that update share a concurrency group, so they never push at once.

on:
  # Manual run: Actions tab > Excavator 4h > Run workflow, or `gh workflow run excavator-4h.yml`
  workflow_dispatch:
    inputs:
      force:
        description: 'Manifests of this tier to re-download and re-hash even if the version did not change (comma-separated, e.g. "NetTime,Privoxy"). Leave empty for a normal run.'
        required: false
        default: ''
        type: string
  schedule:
    # Runs are spread over 00:00-00:40 UTC, daily ones first: Security :00, Excavator 1d :10, Excavator 4h :20, EVE-IPH watch :30, Excavator 1mo :40.
    - cron: '20 */4 * * *'

permissions:
  contents: write

concurrency:
  group: excavator
  cancel-in-progress: false

jobs:
  excavate:
    name: Excavate (Frequent tier)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the tier of a manifest comes from when its version last changed
          fetch-depth: 0
      - name: Keep only the Frequent tier
        # Sparse checkout takes every other manifest out of the working copy: checkver does not see them,
        # and git reports no change for them, so auto-pr neither checks nor commits them.
        shell: pwsh
        run: ./bin/Watch-Tiers.ps1 -Hide -Tier Frequent
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
          # Empty on scheduled runs, so nothing is forced then
          SPECIAL_SNOWFLAKES: ${{ inputs.force }}
