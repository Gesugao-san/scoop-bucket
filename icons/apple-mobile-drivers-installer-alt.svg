<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <title>Apple Mobile Drivers Installer (unofficial icon)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="176" height="176" rx="36" fill="url(#bg)"/>
  <!-- phone body -->
  <rect x="44" y="30" width="62" height="112" rx="14" fill="#f8fafc"/>
  <rect x="51" y="44" width="48" height="80" rx="4" fill="#1e293b"/>
  <rect x="65" y="35" width="20" height="4" rx="2" fill="#94a3b8"/>
  <!-- download arrow on screen -->
  <path d="M75 58 v34 M63 80 l12 12 l12 -12" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="62" y="104" width="26" height="6" rx="3" fill="#38bdf8"/>
  <!-- cable from the phone to the USB plug -->
  <path d="M75 142 v10 q0 14 14 14 h38 q14 0 14 -14 v-38" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
  <!-- USB-A plug -->
  <rect x="127" y="78" width="28" height="36" rx="5" fill="#f8fafc"/>
  <rect x="131" y="56" width="20" height="24" rx="3" fill="#cbd5e1"/>
  <rect x="135" y="62" width="4" height="6" fill="#1e293b"/>
  <rect x="143" y="62" width="4" height="6" fill="#1e293b"/>
</svg>
